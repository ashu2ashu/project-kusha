name: Tests & Code Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Bytecode Compilation Check
        run: |
          python -m py_compile *.py

      - name: Run Full Automated Unit Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Enforce Coverage Floor (Scoring Modules >= 70%)
        run: |
          coverage run -m unittest discover -s tests
          coverage report --fail-under=70 \
            --include="analyzer.py,forensic_risk_engine.py,data_integrity_agent.py,evaluation_cache.py"

      - name: Verify Audit Ledger Immutability
        run: |
          git diff --exit-code -- improvement_ledger.json IMPROVEMENT_LEDGER.md
