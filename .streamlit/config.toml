# StockSage - Cyber-Dark Institutional HUD Theme (Future of Stock Screeners)

[server]
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#00F5A0"             # Cyber Neon Emerald / Dalal Street Alpha
backgroundColor = "#080C14"          # Deep Obsidian Space
secondaryBackgroundColor = "#0F172A" # Cyber Slate Glass Surface
codeBackgroundColor = "#0B111E"
textColor = "#F1F5F9"                # High-contrast Crisp Typography
linkColor = "#00E5FF"                # Cyber Cyan Hologram
borderColor = "#1E293B"              # Subtle Cyber Outline
codeTextColor = "#38BDF8"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"                  # Modern Glass Radius
buttonRadius = "10px"

# Typography - Ultra-clean High-Density Financial Fonts
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [800, 700, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors for financial indicators
greenColor = "#00F5A0"  # Gains / Positive Telemetry
redColor = "#FF453A"    # Losses / Red Flags
yellowColor = "#FFD60A" # Warnings / Cautions
orangeColor = "#FF9F0A" # Watchlist Alerts
blueColor = "#00E5FF"   # Cyber Cyan Hologram
violetColor = "#BF5AF2" # Quantum Accents
grayColor = "#94A3B8"   # High-Tech Neutral

# Chart colors - Neon Multi-Factor Palettes
chartCategoricalColors = [
    "#00F5A0",
    "#00E5FF",
    "#BF5AF2",
    "#FF9F0A",
    "#FF453A",
    "#64D2FF",
    "#30D158",
    "#94A3B8",
]

# Sequential colors for financial heatmaps (Cyan to Emerald)
chartSequentialColors = [
    "#042F2E",
    "#064E3B",
    "#065F46",
    "#047857",
    "#059669",
    "#10B981",
    "#34D399",
    "#6EE7B7",
    "#00E5FF",
    "#00F5A0",
]

# Dataframe styling
dataframeBorderColor = "#1E293B"
dataframeHeaderBackgroundColor = "#0F172A"
dataframeHeaderTextColor = "#F8FAFC"

# Sidebar - Deep Obsidian Terminal
[theme.sidebar]
backgroundColor = "#06090F"
secondaryBackgroundColor = "#0B111E"
codeBackgroundColor = "#080C14"
textColor = "#F1F5F9"
borderColor = "#1E293B"
primaryColor = "#00F5A0"
