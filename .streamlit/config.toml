# StockSage - Professional Green & White Institutional Theme (Screener.in Inspired)

[server]
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#059669"             # Signature Dalal Street Emerald Green
backgroundColor = "#FFFFFF"          # Pure crisp white background
secondaryBackgroundColor = "#F8FAFC" # Subtle slate/off-white for containers and cards
codeBackgroundColor = "#F0FDF4"
textColor = "#0F172A"                # Deep rich charcoal / black typography
linkColor = "#059669"                # Emerald green links
borderColor = "#E2E8F0"              # Crisp subtle border outlines
codeTextColor = "#065F46"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"                   # Modern clean radius
buttonRadius = "8px"

# Typography - Clean, professional institutional fonts
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "14px"
headingFontSizes = ["34px", "26px", "22px", "18px", "15px", "13px"]
headingFontWeights = [800, 700, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors for financial indicators
greenColor = "#059669"  # Positive/gains
redColor = "#DC2626"    # Negative/losses
yellowColor = "#D97706" # Warnings
orangeColor = "#EA580C" # Alerts
blueColor = "#059669"   # Emerald brand
violetColor = "#334155" # Accent
grayColor = "#64748B"   # Neutral slate

# Sidebar - Clean Green & White
[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F0FDF4"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#059669"
