# StockSage - Professional Black & White Institutional Theme

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#000000"             # Solid monochrome black for key action buttons & highlights
backgroundColor = "#FFFFFF"          # Pure crisp white background
secondaryBackgroundColor = "#F8FAFC" # Subtle slate/off-white for containers and cards
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"                # Deep rich charcoal / black typography
linkColor = "#0F172A"
borderColor = "#E2E8F0"              # Crisp subtle border outlines
codeTextColor = "#0F172A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"                   # Modern clean radius
buttonRadius = "8px"

# Typography - Clean, professional institutional fonts
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [800, 700, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors for financial indicators
greenColor = "#059669"  # Positive/gains
redColor = "#DC2626"    # Negative/losses
yellowColor = "#D97706" # Warnings
orangeColor = "#EA580C" # Alerts
blueColor = "#0F172A"   # Primary brand / monochrome black
violetColor = "#334155" # Accent
grayColor = "#64748B"   # Neutral slate

# Sidebar - Clean Black & White
[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#000000"
