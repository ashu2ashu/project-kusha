# StockSage - Crisp Institutional White & Emerald Theme (Dalal Street Terminal)

[server]
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#059669"             # Institutional Emerald / Dalal Street Alpha
backgroundColor = "#FFFFFF"          # Pure Clean White
secondaryBackgroundColor = "#F8FAFC" # Crisp Light Slate Surface
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"                # Deep Obsidian Navy Typography
linkColor = "#059669"                # Emerald Accent Links
borderColor = "#E2E8F0"              # Subtle Crisp Border
codeTextColor = "#0F172A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"

# Typography - Ultra-clean High-Density Financial Fonts
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [800, 700, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors for financial indicators
greenColor = "#059669"  # Gains / Positive Telemetry
redColor = "#DC2626"    # Losses / Red Flags
yellowColor = "#D97706" # Warnings / Cautions
orangeColor = "#EA580C" # Watchlist Alerts
blueColor = "#2563EB"   # Institutional Blue
violetColor = "#7C3AED" # Premium Purple
grayColor = "#64748B"   # Neutral Slate

# Chart colors - Institutional Multi-Factor Palettes
chartCategoricalColors = [
    "#059669",
    "#2563EB",
    "#7C3AED",
    "#D97706",
    "#DC2626",
    "#0D9488",
    "#4F46E5",
    "#64748B",
]

# Sequential colors for financial heatmaps (Light to Deep Emerald)
chartSequentialColors = [
    "#ECFDF5",
    "#D1FAE5",
    "#A7F3D0",
    "#6EE7B7",
    "#34D399",
    "#10B981",
    "#059669",
    "#047857",
    "#065F46",
    "#064E3B",
]

# Dataframe styling
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"
dataframeHeaderTextColor = "#0F172A"

# Sidebar - Clean White / Slate Terminal
[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#059669"
